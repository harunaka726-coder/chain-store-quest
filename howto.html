<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>遊び方 — チェーン店クエスト</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body class="page">
  <header class="page-header">
    <a class="back" href="index.html">← マップへ</a>
    <h1>遊び方</h1>
  </header>
  <main class="page-main">
    <ol class="steps">
      <li>場所を検索するか、地図を動かします。</li>
      <li>「このエリアの店舗を取得」でチェーン店を表示します。</li>
      <li>表示したいチェーンを選びます（追加も可能）。</li>
      <li>店舗ピンを順にクリックして線を引きます。</li>
      <li>最初のピンに戻るとエリアが閉じます。続けて次のルートも描けます。</li>
      <li>末尾のピンをもう一度押すと選択解除できます。</li>
      <li>四角形／円で範囲を選ぶと、店数とリストを集計できます。</li>
    </ol>
    <p class="note">店舗データは OpenStreetMap 由来のため、実際の店舗と完全一致しない場合があります。</p>
  </main>
  <footer class="page-footer">
    <a href="privacy.html">プライバシーポリシー</a>
    <a href="https://forms.gle/btfuXnhQQz9ByiVd7" target="_blank" rel="noopener noreferrer">お問い合わせ</a>
  </footer>
</body>
</html>
